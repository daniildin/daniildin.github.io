<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Start</title>
<style>
:root {
  /* Replace this URL with your own wallpaper image. */
  --wallpaper: url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2560&q=90");
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  background-color: #17252b;
  background-image: url("my-picture.jpg");
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.search {
  position: fixed;
  top: 32%;
  left: 50%;
  transform: translateX(-50%);
  width: min(520px, calc(100vw - 48px));
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 18px;
  background: rgba(18,28,34,.36);
  box-shadow: 0 12px 48px rgba(0,0,0,.16);
  -webkit-backdrop-filter: blur(22px);
  backdrop-filter: blur(22px);
}
.search:focus-within { border-color: rgba(255,255,255,.5); background: rgba(18,28,34,.48); }
.search input {
  width: 100%; padding: 19px 24px; border: 0; outline: none;
  border-radius: inherit; background: transparent; color: #f4f6f7;
  font: inherit; font-size: 16px;
}
.search input::placeholder { color: rgba(255,255,255,.65); }
@media (max-height: 600px) { .search { top: 24px; } .notes { height: min(280px, calc(100dvh - 140px)); } }
.notes {
  position: fixed;
  right: max(32px, env(safe-area-inset-right));
  bottom: max(32px, env(safe-area-inset-bottom));
  width: min(360px, calc(100vw - 48px));
  height: min(280px, calc(100dvh - 48px));
  padding: 25px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 22px;
  background: rgba(18,28,34,.36);
  box-shadow: 0 12px 48px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.06);
  -webkit-backdrop-filter: blur(22px) saturate(120%);
  backdrop-filter: blur(22px) saturate(120%);
  transition: background .2s, border-color .2s;
}
.notes:focus-within { background: rgba(18,28,34,.48); border-color: rgba(255,255,255,.35); }
textarea {
  display: block; width: 100%; height: 100%; margin: 0; padding: 0;
  border: 0; outline: none; resize: none; background: transparent;
  color: #f4f6f7; caret-color: #fff; font: 400 15px/1.75 inherit;
  font-family: inherit; font-size: 15px; line-height: 1.75;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent;
}
textarea::placeholder { color: rgba(255,255,255,.6); }
textarea::selection { background: rgba(195,222,231,.3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@supports not (backdrop-filter: blur(1px)) { .notes { background: rgba(18,28,34,.85); } }
@media (max-width: 480px) { .notes { right: 24px; bottom: max(24px, env(safe-area-inset-bottom)); padding: 22px; } }
@media (prefers-reduced-motion: reduce) { .notes { transition: none; } }
</style>
</head>
<body>
<form class="search" role="search" action="https://www.google.com/search" method="get">
  <input type="search" name="q" aria-label="Search Google" placeholder="Search" autocomplete="off" required>
</form>
<main class="notes">
  <textarea id="notes" aria-label="Personal notes" placeholder="My Thoughts" spellcheck="true"></textarea>
  <p id="status" role="status" class="sr-only"></p>
</main>
<script>
(() => {
  'use strict';
  const key = 'personal-start-page.notes.v1';
  const notes = document.getElementById('notes');
  const status = document.getElementById('status');
  const unavailable = () => {
    status.textContent = 'Browser storage is unavailable. These notes will not survive closing the page.';
    notes.placeholder = 'Storage unavailable — copy notes before closing…';
  };
  try { notes.value = localStorage.getItem(key) ?? ''; }
  catch { unavailable(); }
  // Save each edit immediately, including when the text is cleared.
  notes.addEventListener('input', () => {
    try { localStorage.setItem(key, notes.value); status.textContent = ''; }
    catch { unavailable(); }
  });
  // Keep another open tab in sync without interrupting active typing.
  window.addEventListener('storage', event => {
    if (event.key === key && document.activeElement !== notes) {
      notes.value = event.newValue ?? '';
    }
  });
})();
</script>
</body>
</html>
